<na-app>
  <na-page maxWidth="sm">
    <na-stack gap="lg">
      <na-stack gap="sm">
        <na-heading level="1">Noecore MediaLinker</na-heading>
        <na-text tone="muted">
          Upload a media file or grab a YouTube video, get a direct link to it.
        </na-text>
      </na-stack>

      <na-card>
        <na-tabs [(active)]="tab">
          <na-tab id="upload" title="Upload file">
            <na-stack gap="md">
              <na-upload
                action="/upload"
                name="file"
                [limit]="1"
                [drag]="true"
                (change)="onChange($event)"
              />
              <na-text tone="faint" size="sm">{{ hint() }}</na-text>
            </na-stack>
          </na-tab>

          <na-tab id="youtube" title="YouTube">
            <na-stack gap="md">
              <na-field label="Video URL">
                <input
                  naInput
                  placeholder="https://www.youtube.com/watch?v=..."
                  [(ngModel)]="ytUrl"
                  [disabled]="loading()"
                />
              </na-field>

              <na-radio-group
                variant="segmented"
                orientation="inline"
                [options]="formats"
                [(value)]="ytFormat"
                [disabled]="loading()"
              />

              <na-button
                variant="primary"
                [loading]="loading()"
                [disabled]="!ytUrl"
                (pressed)="convert()"
              >
                Get link
              </na-button>
            </na-stack>
          </na-tab>
        </na-tabs>
      </na-card>

      @if (url()) {
        <na-alert tone="success" showIcon title="Your direct link" closable>
          <na-link [href]="url()" copyable [copyText]="url()">{{ url() }}</na-link>
        </na-alert>
      }
      @if (error()) {
        <na-alert tone="danger" showIcon [title]="error()" closable />
      }
    </na-stack>
  </na-page>
</na-app>
