name: noecore-medialinker

# Designed for Coolify (Traefik handles HTTPS). In Coolify, set the app service's
# Domains field to https://<your-domain>:3000 and set DOMAIN to the bare hostname.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=media.example.com}
      SCHEME: ${SCHEME:-https}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      CLIP_MAX_MB: ${CLIP_MAX_MB:-100}
    volumes:
      - uploads:/data/uploads
      - shares:/data/shares
      - clips:/data/clips

volumes:
  uploads:
  shares:
  clips:
